[project]
name = "dx-instrument-server"
version = "2.0.0"
description = "Dx instrument interface server (ASTM E1381/E1394 and HL7 v2 MLLP)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dx-instrument-server = "dx_instrument.cli:main"
dx-instrument-simulator = "dx_instrument.simulator:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dx_instrument"]
