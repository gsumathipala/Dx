{% if page_obj.paginator.num_pages > 1 %}
<div class="pagination no-print">
    {% if page_obj.has_previous %}
        <a href="?{{ querystring }}page=1">First</a>
        <a href="?{{ querystring }}page={{ page_obj.previous_page_number }}">Previous</a>
    {% endif %}
    <span class="current">{{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a href="?{{ querystring }}page={{ page_obj.next_page_number }}">Next</a>
        <a href="?{{ querystring }}page={{ page_obj.paginator.num_pages }}">Last</a>
    {% endif %}
    <span class="muted">{{ page_obj.paginator.count }} record{{ page_obj.paginator.count|pluralize }}</span>
</div>
{% endif %}
